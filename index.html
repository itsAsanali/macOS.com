  <script type="module">
import { createHotContext } from "/@vite/client";
const hot = createHotContext("/__dummy__runtime-error-plugin");

function sendError(error) {
  if (!(error instanceof Error)) {
    error = new Error("(unknown runtime error)");
  }
  const serialized = {
    message: error.message,
    stack: error.stack,
  };
  hot.send("runtime-error-plugin:error", serialized);
}

// Only notify the parent frame after the server confirms the error passed
// the filter and the overlay will be shown.
hot.on("runtime-error-plugin:notify-parent", () => {
  try {
    window.parent.postMessage({ type: "runtime-error", id: null }, "*");
  } catch (_) {}
});

window.addEventListener("error", (evt) => {
  sendError(evt.error);
});

window.addEventListener("unhandledrejection", (evt) => {
  sendError(evt.reason);
});
</script>

  <script>(function() {
  var initialized = false;

  function loadTailwind() {
    if (initialized) { return; }
    initialized = true;

        var script = document.createElement('script');
        script.src = "https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.14";

        if (window.REPLIT_APP_TAILWIND_CONFIG) {
          script.setAttribute('data-config', JSON.stringify(window.REPLIT_APP_TAILWIND_CONFIG));
        }

        document.head.appendChild(script);
  }

  // Listen for the beacon requesting tailwind initialization.
  window.addEventListener('replit-init-tailwind', function() {
    if (window.REPLIT_APP_TAILWIND_CONFIG) {
      loadTailwind();
    } else {
      // Config not ready yet — wait for the config-ready event, but proceed
      // without a config after 1 second.  The config is optional (projects
      // without a tailwind config file will never fire the ready event).
      var configTimeout = setTimeout(function() { loadTailwind(); }, 1000);
      window.addEventListener('replit-tailwind-config-ready', function() {
        clearTimeout(configTimeout);
        loadTailwind();
      }, { once: true });
    }
  });
})();</script>

<body>
<!-- Desktop -->
<div id="desktop">
  <!-- Wallpaper overlays -->
  <div style="position:absolute;inset:0;background:radial-gradient(ellipse at 70% 30%, rgba(83,52,131,0.6) 0%, transparent 60%);pointer-events:none;"></div>
  <div style="position:absolute;inset:0;background:radial-gradient(ellipse at 20% 80%, rgba(16,33,96,0.7) 0%, transparent 50%);pointer-events:none;"></div>

  <!-- Menu Bar -->
  <div id="menubar">
    <div id="menubar-left">
      <span class="menubar-item apple-logo" onclick="toggleLaunchpad()"></span>
      <span class="menubar-item" id="app-menu-name" style="font-weight:700;">Finder</span>
      <span class="menubar-item">Файл</span>
      <span class="menubar-item">Правка</span>
      <span class="menubar-item">Вид</span>
      <span class="menubar-item">Перейти</span>
      <span class="menubar-item">Окно</span>
      <span class="menubar-item">Справка</span>
    </div>
    <div id="menubar-right">
      <span class="menubar-item" onclick="toggleCC()"><i class="fas fa-wifi" style="font-size:12px;"></i></span>
      <span class="menubar-item" onclick="toggleCC()"><i class="fas fa-bluetooth-b" style="font-size:11px;"></i></span>
      <span class="menubar-item" onclick="toggleCC()"><i class="fas fa-sliders-h" style="font-size:12px;"></i></span>
      <span class="menubar-item" onclick="toggleSpotlight()" title="Cmd+Space"><i class="fas fa-search" style="font-size:11px;"></i></span>
      <span class="menubar-item" id="menubar-time" style="font-size:12px;font-weight:600;"></span>
    </div>
  </div>

  <!-- Stage Manager -->
  <div id="stage-manager" class="visible">
  </div>

  <!-- Windows container -->
  <div id="windows-container"></div>

  <!-- Dock -->
  <div id="dock"></div>

  <!-- Desktop icons -->
  <div id="desktop-icons" style="position:absolute;top:36px;left:0;right:0;bottom:70px;padding:16px;"></div>
</div>

<!-- Spotlight -->
<div id="spotlight" onclick="closeSpotlight(event)">
  <div id="spotlight-box" onclick="event.stopPropagation()">
    <div style="display:flex;align-items:center;padding:0 16px;">
      <i class="fas fa-search" style="color:#999;font-size:18px;margin-right:10px;"></i>
      <input id="spotlight-input" placeholder="Spotlight — Поиск" oninput="spotlightSearch(this.value)" onkeydown="spotlightKey(event)"/>
    </div>
    <div id="spotlight-results"></div>
  </div>
</div>

<!-- Control Center -->
<div id="control-center">
  <div class="cc-row">
    <div class="cc-tile active" id="cc-wifi" onclick="toggleCCTile('cc-wifi')">
      <div class="cc-tile-icon"><i class="fas fa-wifi"></i></div>
      <div class="cc-tile-label">Wi-Fi</div>
      <div style="font-size:10px;opacity:.7;">Домашняя сеть</div>
    </div>
    <div class="cc-tile" id="cc-bt" onclick="toggleCCTile('cc-bt')">
      <div class="cc-tile-icon"><i class="fab fa-bluetooth-b"></i></div>
      <div class="cc-tile-label">Bluetooth</div>
    </div>
    <div class="cc-tile" id="cc-airdrop" onclick="toggleCCTile('cc-airdrop')">
      <div class="cc-tile-icon"><i class="fas fa-broadcast-tower"></i></div>
      <div class="cc-tile-label">AirDrop</div>
    </div>
  </div>
  <div class="cc-row">
    <div class="cc-tile" id="cc-focus" onclick="toggleCCTile('cc-focus')">
      <div class="cc-tile-icon"><i class="fas fa-moon"></i></div>
      <div class="cc-tile-label">Фокус</div>
    </div>
    <div class="cc-tile active" id="cc-sm" onclick="toggleStageManager()">
      <div class="cc-tile-icon"><i class="fas fa-th-large"></i></div>
      <div class="cc-tile-label">Stage Manager</div>
    </div>
    <div class="cc-tile" id="cc-airplay" onclick="toggleCCTile('cc-airplay')">
      <div class="cc-tile-icon"><i class="fas fa-tv"></i></div>
      <div class="cc-tile-label">AirPlay</div>
    </div>
  </div>
  <div style="margin-bottom:10px;">
    <div style="font-size:11px;font-weight:600;color:#666;margin-bottom:6px;">Яркость</div>

// ==================== CLOCK ====================
function updateMenubarClock() {
  const d = new Date();
  const days = ["Вс","Пн","Вт","Ср","Чт","Пт","Сб"];
  const months = ["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"];
  const h = String(d.getHours()).padStart(2,"0");
  const m = String(d.getMinutes()).padStart(2,"0");
  document.getElementById("menubar-time").textContent = `${days[d.getDay()]}, ${d.getDate()} ${months[d.getMonth()]} ${h}:${m}`;
}

// ==================== DOCK ====================
function buildDock() {
  const dock = document.getElementById("dock");
  dock.innerHTML = "";
  const appList = Object.keys(APPS).slice(0,16);
  appList.forEach(appId => {
    const app = APPS[appId];
    if (!app) return;
    const item = document.createElement("div");
    item.className = "dock-item";
    item.innerHTML = `<div class="dock-icon" style="background:${app.bg};" onclick="openApp('${appId}')">${app.icon}</div><div class="dock-label">${app.name}</div>`;
    const isRunning = Object.values(openWindows).some(w=>w.appId===appId);
    if (isRunning) {
      const dot = document.createElement("div");
      dot.className = "dock-dot";
      dot.id = `dock-dot-${appId}`;
      item.appendChild(dot);
    }
    // Magnification
    item.querySelector(".dock-icon").addEventListener("mouseenter", function(e) {
      const dockItems = dock.querySelectorAll(".dock-icon");
      const idx = [...dockItems].indexOf(this);
      dockItems.forEach((el,i) => {
        const dist = Math.abs(i - idx);
        const scale = dist === 0 ? 1.5 : dist === 1 ? 1.25 : dist === 2 ? 1.1 : 1;
        const translateY = dist === 0 ? -16 : dist === 1 ? -10 : dist === 2 ? -4 : 0;
        el.style.transform = `scale(${scale}) translateY(${-translateY}px)`;
      });
    });
    dock.addEventListener("mouseleave", function() {
      dock.querySelectorAll(".dock-icon").forEach(el => { el.style.transform = ""; });
    });
    dock.appendChild(item);
  });
  // Separator
  const sep = document.createElement("div");
  sep.className = "dock-separator";
  dock.appendChild(sep);
  // Trash
  const trash = document.createElement("div");
  trash.className = "dock-item";
  trash.innerHTML = `<div class="dock-icon" style="background:linear-gradient(135deg,#2c3e50,#4a6fa5);" onclick="showNotification('Корзина','Корзина пуста.','🗑️')">🗑️</div><div class="dock-label">Корзина</div>`;
  dock.appendChild(trash);
}

function updateDockDots() {
  document.querySelectorAll(".dock-dot").forEach(d => d.remove());
  Object.values(openWindows).forEach(w => {
    if (!w.visible) return;
    const appId = w.appId;
    const icon = document.querySelector(`.dock-icon[onclick="openApp('${appId}')"]`);
    if (icon && icon.parentElement && !icon.parentElement.querySelector(".dock-dot")) {
      const dot = document.createElement("div");
      dot.className = "dock-dot";
      icon.parentElement.appendChild(dot);
    }
  });
}

// ==================== LAUNCHPAD ====================
function buildLaunchpad() {
  const grid = document.getElementById("launchpad-grid");
  grid.innerHTML = "";
  Object.entries(APPS).forEach(([id,app]) => {

    item.className = "lp-item";

// ==================== WINDOWS ====================
function openApp(appId) {
  const app = APPS[appId];
  if (!app) return;
  // If window exists and not minimized, focus it
  const existing = Object.values(openWindows).find(w => w.appId === appId && w.visible);
  if (existing) { focusWindow(existing.id); return; }
  // Create new window
  const winId = nextWinId++;
  const el = document.createElement("div");
  el.className = `window window-open${isDark ? " dark" : ""}`;
  el.id = `win-${winId}`;
  const sw = window.innerWidth, sh = window.innerHeight;
  const w = Math.min(900, sw * 0.75);
  const h = Math.min(700, sh * 0.75);
  const x = Math.max(80, (sw - w) / 2 + (winId % 5) * 30);
  const y = Math.max(36, (sh - h) / 2 + (winId % 5) * 20);
  el.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${h}px;`;
  el.innerHTML = `
    <div class="window-titlebar" onmousedown="startDrag(event,${winId})">
      <div class="window-buttons">
        <button class="win-btn btn-close" onclick="closeWindow(${winId})"></button>
        <button class="win-btn btn-min" onclick="minimizeWindow(${winId})"></button>
        <button class="win-btn btn-max" onclick="maximizeWindow(${winId})"></button>
      </div>
      <div class="window-title">${app.title}</div>
    </div>
    <div class="window-body" id="wb-${winId}">${getAppContent(appId, winId)}</div>
    <div class="resize-handle" onmousedown="startResize(event,${winId})"></div>
  `;
  el.onmousedown = () => focusWindow(winId);
  document.getElementById("windows-container").appendChild(el);
  openWindows[winId] = { id:winId, appId, el, visible:true, x, y, w, h, maximized:false };
  focusWindow(winId);
  updateDockDots();
  document.getElementById("app-menu-name").textContent = app.name;
  // Post-render hooks
  setTimeout(() => postRender(appId, winId), 50);
  addToStageManager(winId, appId);
}

function postRender(appId, winId) {
  if (appId === "terminal") { const inp = document.getElementById(`term-input-${winId}`); if(inp) inp.focus(); }
  if (appId === "activityMonitor") startActivityMonitor(winId);
  if (appId === "stocks") renderStockChart(winId, activeStock);
  if (appId === "clock") startClock(winId);
  if (appId === "freeform") initFreeform(winId);
  if (appId === "voiceMemos") initVoiceMemo(winId);
  if (appId === "diskUtility") renderDiskChart(winId);
  if (appId === "findMy") startFindMyRadar(winId);
  if (appId === "music") renderMusicViz(winId);
  if (appId === "weather") renderWeatherBg(winId);
}

function closeWindow(winId) {
  const win = openWindows[winId];
  if (!win) return;
  win.el.style.animation = "winMin .2s ease forwards";
  setTimeout(() => {
    if (win.el.parentNode) win.el.parentNode.removeChild(win.el);
    delete openWindows[winId];
    updateDockDots();
    buildStageManager();
  }, 200);
  // Stop any intervals
  clearInterval(win._amInterval);
  clearInterval(win._clockInterval);
}

function minimizeWindow(winId) {
  const win = openWindows[winId];
  if (!win) return;
  win.el.style.animation = "winMin .25s ease forwards";
  setTimeout(() => {
    win.el.style.display = "none";
    win.el.style.animation = "";
    win.visible = false;
    updateDockDots();
    buildStageManager();
  }, 250);
}

function maximizeWindow(winId) {
  const win = openWindows[winId];
  if (!win) return;
  if (win.maximized) {
    win.el.style.left = win.prevX + "px";
    win.el.style.top = win.prevY + "px";
    win.el.style.width = win.prevW + "px";
    win.el.style.height = win.prevH + "px";
    win.maximized = false;
  } else {
    win.prevX = parseInt(win.el.style.left);
    win.prevY = parseInt(win.el.style.top);
    win.prevW = parseInt(win.el.style.width);
    win.prevH = parseInt(win.el.style.height);
    win.el.style.left = (stageManagerEnabled ? "100px" : "0") + "px";
    win.el.style.top = "28px";
    win.el.style.width = `calc(100vw - ${stageManagerEnabled ? "100px" : "0px"})`;
    win.el.style.height = "calc(100vh - 98px)";
    win.maximized = true;
  }
}

function focusWindow(winId) {
  Object.values(openWindows).forEach(w => {
    w.el.classList.remove("focused");
    w.el.style.zIndex = 1000 + w.id;
  });
  const win = openWindows[winId];
  if (win) {
    win.el.classList.add("focused");
    win.el.style.zIndex = 5000;
    if (!win.visible) {
      win.el.style.display = "flex";
      win.el.style.animation = "winOpen .22s cubic-bezier(0.34,1.56,0.64,1)";
      win.visible = true;
      updateDockDots();
    }
    document.getElementById("app-menu-name").textContent = APPS[win.appId]?.name || "Finder";
  }
}

// ==================== DRAG & RESIZE ====================
let dragState = null;
function startDrag(e, winId) {
  if (e.target.classList.contains("win-btn")) return;
  e.preventDefault();
  const win = openWindows[winId];
  dragState = { winId, startX:e.clientX, startY:e.clientY, origX:parseInt(win.el.style.left)||0, origY:parseInt(win.el.style.top)||0 };
  document.addEventListener("mousemove", onDrag);
  document.addEventListener("mouseup", stopDrag);
}
function onDrag(e) {
  if (!dragState) return;
  const win = openWindows[dragState.winId];
  if (!win) return;
  const nx = dragState.origX + (e.clientX - dragState.startX);
  const ny = Math.max(28, dragState.origY + (e.clientY - dragState.startY));
  win.el.style.left = nx + "px";
  win.el.style.top = ny + "px";
}
function stopDrag() { dragState = null; document.removeEventListener("mousemove", onDrag); document.removeEventListener("mouseup", stopDrag); }

let resizeState = null;
function startResize(e, winId) {
  e.preventDefault(); e.stopPropagation();
  const win = openWindows[winId];
  resizeState = { winId, startX:e.clientX, startY:e.clientY, origW:parseInt(win.el.style.width)||600, origH:parseInt(win.el.style.height)||400 };
  document.addEventListener("mousemove", onResize);
  document.addEventListener("mouseup", stopResize);
}
function onResize(e) {
  if (!resizeState) return;
  const win = openWindows[resizeState.winId];
  if (!win) return;
  win.el.style.width = Math.max(300, resizeState.origW + (e.clientX - resizeState.startX)) + "px";
  win.el.style.height = Math.max(200, resizeState.origH + (e.clientY - resizeState.startY)) + "px";
}
function stopResize() { resizeState = null; document.removeEventListener("mousemove", onResize); document.removeEventListener("mouseup", stopResize); }

function addContact(wid) {
  const name = prompt("Имя контакта:","Новый Контакт");
  if (!name) return;
  const phone = prompt("Телефон:","+7 999 000-00-00");
  const email = prompt("Email:","example@mail.ru");
  const colors = ["#0a84ff","#30d158","#ff453a","#ff9f0a","#bf5af2","#32ade6"];
  contactsData.push({id:Date.now(),name,phone:phone||"",email:email||"",color:colors[Math.floor(Math.random()*colors.length)]});
  const list = document.getElementById(`contacts-list-${wid}`);
  if (list) list.innerHTML = contactsData.map(c=>`<div class="contact-item" onclick="showContact(${wid},${c.id})"><div class="contact-avatar" style="background:${c.color};">${c.name[0]}</div><div><div style="font-weight:600;">${c.name}</div><div style="font-size:11px;color:#888;">${c.phone}</div></div></div>`).join("");
  showNotification("Контакты","Контакт добавлен!","👤");

function deleteContact(wid, id) {
  const idx = contactsData.findIndex(c=>c.id===id);
  if (idx>=0) contactsData.splice(idx,1);
  const list = document.getElementById(`contacts-list-${wid}`);
  if (list) list.innerHTML = contactsData.map(c=>`<div class="contact-item" onclick="showContact(${wid},${c.id})"><div class="contact-avatar" style="background:${c.color};">${c.name[0]}</div><div><div style="font-weight:600;">${c.name}</div><div style="font-size:11px;color:#888;">${c.phone}</div></div></div>`).join("");
  document.getElementById(`contact-detail-${wid}`).innerHTML = `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#888;gap:8px;"><div style="font-size:60px;">👤</div><div>Контакт удалён</div></div>`;
}
function contactSearch(wid, q) {
  const list = document.getElementById(`contacts-list-${wid}`);
  if (!list) return;
  const filtered = q ? contactsData.filter(c=>c.name.toLowerCase().includes(q.toLowerCase())) : contactsData;
  list.innerHTML = filtered.map(c=>`<div class="contact-item" onclick="showContact(${wid},${c.id})"><div class="contact-avatar" style="background:${c.color};">${c.name[0]}</div><div><div style="font-weight:600;">${c.name}</div><div style="font-size:11px;color:#888;">${c.phone}</div></div></div>`).join("");
}

  const grid = document.getElementById(`cal-grid-${wid}`);
  const monthEl = document.getElementById(`cal-month-${wid}`);
  if (!grid) return;
  const d = calCurrentMonth;
  const months = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
  monthEl.textContent = `${months[d.getMonth()]} ${d.getFullYear()}`;
  const first = new Date(d.getFullYear(), d.getMonth(), 1);
  const lastDay = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
  let startDow = (first.getDay()+6)%7; // Mon=0
  const today = new Date();
  let html = "";
  for (let i=0;i<startDow;i++) html += `<div class="cal-cell" style="color:#ccc;">${new Date(d.getFullYear(),d.getMonth(),-(startDow-1-i)).getDate()}</div>`;
  for (let day=1;day<=lastDay;day++) {
    const isToday = today.getFullYear()===d.getFullYear()&&today.getMonth()===d.getMonth()&&today.getDate()===day;
    const key = `${d.getFullYear()}-${d.getMonth()+1}-${day}`;
    const hasEv = !!calEvents[key];
    html += `<div class="cal-cell" onclick="calClickDay(${wid},'${key}',${day})" style="${isToday?"background:#0a84ff;color:#fff;border-radius:50%;width:30px;height:30px;margin:auto;":""}${hasEv?"border-bottom:2px solid #0a84ff;":""}">${day}</div>`;
  }
  grid.innerHTML = html;
}
function calClickDay(wid, key, day) {
  const evEl = document.getElementById(`cal-events-${wid}`);
  if (!evEl) return;
  const evs = calEvents[key] || [];
  evEl.innerHTML = `<div style="font-weight:600;margin-bottom:8px;font-size:13px;">📅 ${key} — события:</div>
    ${evs.map(e=>`<div style="padding:4px 0;font-size:13px;">• ${e}</div>`).join("") || "<div style='color:#888;font-size:12px;'>Нет событий. Нажмите + чтобы добавить.</div>"}
    <button onclick="calAddEvent(${wid},'${key}')" style="margin-top:8px;background:#0a84ff;color:#fff;border:none;border-radius:6px;padding:5px 12px;cursor:pointer;font-size:12px;">+ Добавить событие</button>`;
}

  if (nameEl) nameEl.textContent = contact || "FaceTime пользователь";

    const vid = document.getElementById(`facetime-cam-${wid}`);
    const local = document.getElementById(`facetime-local-${wid}`);
    if (vid) vid.srcObject = stream;
    if (local) local.srcObject = stream;
  }).catch(()=>{});
  setTimeout(() => { showNotification("FaceTime","Звонок подключён","📹"); }, 2000);
}
function facetimeEnd(wid) {

  ["facetime-cam-","facetime-local-"].forEach(id => {
    const v = document.getElementById(id+wid);
    if (v?.srcObject) { v.srcObject.getTracks().forEach(t=>t.stop()); v.srcObject=null; }
  });
}

// ========== 11. TERMINAL ==========
function renderTerminal(wid) {
  return `<div class="terminal-body" id="term-body-${wid}" style="height:100%;display:flex;flex-direction:column;">
    <div id="term-output-${wid}" style="flex:1;overflow-y:auto;"></div>
    <div class="terminal-input-line">
      <span class="terminal-prompt">${termCwd} $ </span>
      <input id="term-input-${wid}" class="terminal-input" autocomplete="off" spellcheck="false" onkeydown="termKey(event,${wid})"/>
    </div>
  </div>`;
}
function termPrint(wid, text, color="") {
  const out = document.getElementById(`term-output-${wid}`);
  if (!out) return;
  const line = document.createElement("div");
  line.className = "terminal-line";
  if (color) line.style.color = color;
  line.textContent = text;
  out.appendChild(line);
  out.scrollTop = out.scrollHeight;
}
function termPrintHTML(wid, html) {
  const out = document.getElementById(`term-output-${wid}`);
  if (!out) return;
  const line = document.createElement("div");
  line.className = "terminal-line";
  line.innerHTML = html;
  out.appendChild(line);
  out.scrollTop = out.scrollHeight;
}
function termKey(e, wid) {
  if (e.key === "ArrowUp") { if (histIdx < termHistory.length-1) { histIdx++; e.target.value = termHistory[termHistory.length-1-histIdx] || ""; } return; }
  if (e.key === "ArrowDown") { if (histIdx > 0) { histIdx--; e.target.value = termHistory[termHistory.length-1-histIdx] || ""; } else { histIdx=-1; e.target.value=""; } return; }
  if (e.key !== "Enter") return;
  const cmd = e.target.value.trim();
  if (!cmd) return;
  termPrint(wid, `${termCwd} $ ${cmd}`, "#00ff41");
  termHistory.push(cmd);
  histIdx = -1;
  e.target.value = "";
  const parts = cmd.split(" ");
  const c = parts[0];
  const args = parts.slice(1);
  // Update prompt
  const prompt = document.querySelector(`#term-body-${wid} .terminal-prompt`);
  switch(c) {
    case "ls":
      const files = termFiles[termCwd] || [];
      if (files.length) { files.forEach(f => termPrint(wid, f, f.includes(".")?"#56b6c2":"#61afef")); }
      else termPrint(wid, "(пусто)");
      break;
    case "cd":
      const target = args[0];
      if (!target || target === "~") { termCwd="~"; }
      else if (target === "..") { const parts2=termCwd.split("/"); parts2.pop(); termCwd=parts2.join("/")||"~"; }
      else { const newPath = termCwd==="~" ? `~/${target}` : `${termCwd}/${target}`; if(termFiles[newPath]) termCwd=newPath; else termPrint(wid,`cd: no such file or directory: ${target}`,"#ff453a"); }
      if (prompt) prompt.textContent = `${termCwd} $ `;
      break;
    case "clear":
      const out = document.getElementById(`term-output-${wid}`);
      if (out) out.innerHTML = "";
      break;
    case "echo":
      termPrint(wid, args.join(" "));
      break;
    case "cat":
      const f = args[0];
      if (!f) { termPrint(wid,"Usage: cat <file>","#ff9f0a"); break; }
      if (f==="notes.txt") termPrint(wid,"Заметка: Не забыть купить молоко.\nМаршрут на завтра: парк → кофейня → работа.");
      else if (f==="resume.pdf") termPrint(wid,"[PDF] Резюме: Разработчик ПО, 5 лет опыта...");
      else if (f==="README.md") termPrint(wid,"# macOS Ventura Simulator\nВерсия 1.0\nАвтор: Agent");
      else termPrint(wid,`cat: ${f}: No such file or directory`,"#ff453a");
      break;
    case "pwd":
      termPrint(wid, `/Users/user/${termCwd.replace("~","")}`);
      break;
    case "date":
      termPrint(wid, new Date().toString());
      break;
    case "whoami":
      termPrint(wid, "user");
      break;
    case "ping":
      const host = args[0]||"google.com";
      termPrint(wid,`PING ${host}: 56 bytes of data.`);
      [28,31,29,27,30].forEach((ms,i)=>setTimeout(()=>termPrint(wid,`64 bytes from ${host}: icmp_seq=${i+1} ttl=116 time=${ms} ms`),i*500));
      break;
    case "neofetch":
      termPrintHTML(wid,`<span style="color:#f5a623;">        ___</span><br><span style="color:#f5a623;">       /  /\\  </span>  <span style="color:#61afef;">user@macbook</span><br><span style="color:#f5a623;">      / /  \\ </span>  <span style="color:#555;">-----------</span><br><span style="color:#f5a623;">     /  ____\\ </span> OS: macOS Ventura 13<br><span style="color:#f5a623;">    / /  \\ \\  </span> Host: MacBook Pro (2023)<br><span style="color:#f5a623;">   /_/    \\_\\ </span> CPU: Apple M3 Pro<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;RAM: 18 GB`);
      break;
    case "theme":
      isDark = !isDark;
      document.querySelectorAll(".window").forEach(w=>w.classList.toggle("dark",isDark));
      termPrint(wid, `Тема изменена: ${isDark?"🌙 Тёмная":"☀️ Светлая"}`);
      break;
    case "help":
      ["ls","cd [dir]","cat [file]","echo [text]","pwd","date","whoami","ping [host]","clear","neofetch","theme","help"].forEach(h=>termPrint(wid,"  "+h,"#56b6c2"));
      break;
    case "mkdir":
      if (args[0]) { if(!termFiles[termCwd]) termFiles[termCwd]=[]; termFiles[termCwd].push(args[0]); termPrint(wid,`Создана папка: ${args[0]}`,"#30d158"); }
      break;
    case "touch":
      if (args[0]) { if(!termFiles[termCwd]) termFiles[termCwd]=[]; termFiles[termCwd].push(args[0]); termPrint(wid,`Создан файл: ${args[0]}`,"#30d158"); }
      break;
    default:
      termPrint(wid, `command not found: ${c}`, "#ff453a");
  }
}

// ========== 12. CALCULATOR ==========
let calcExpr = "";
let calcDisplay = "0";
let calcNewNum = true;
function renderCalculator(wid) {
  return `<div style="background:#1c1c1e;height:100%;display:flex;flex-direction:column;padding:16px;gap:10px;min-width:280px;">
    <div style="background:rgba(0,0,0,0.3);border-radius:12px;padding:16px 20px;text-align:right;">
      <div id="calc-expr-${wid}" style="color:rgba(255,255,255,0.4);font-size:13px;min-height:18px;">${calcExpr}</div>
      <div id="calc-display-${wid}" style="color:#fff;font-size:44px;font-weight:300;overflow:hidden;text-overflow:ellipsis;">${calcDisplay}</div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;">
      ${[
        ["AC","±","%","÷"],
        ["7","8","9","×"],
        ["4","5","6","−"],
        ["1","2","3","+"],
        ["0","",".",  "="],
      ].map(row=>row.map((b,ci)=>b===""?`<div></div>`:`<button class="calc-btn ${["÷","×","−","+","="].includes(b)?"calc-orange":["AC","±","%"].includes(b)?"calc-light":"calc-dark"}" onclick="calcPress(${wid},'${b}')" style="${b==="0"&&row.indexOf(b)===0?"grid-column:span 2;border-radius:30px;":"border-radius:50%;"}">${b}</button>`).join("")).join("")}
    </div>
  </div>`;
}
function calcPress(wid, btn) {
  const disp = document.getElementById(`calc-display-${wid}`);
  const expr = document.getElementById(`calc-expr-${wid}`);
  if (!disp) return;
  if (btn === "AC") { calcExpr=""; calcDisplay="0"; calcNewNum=true; }
  else if (btn === "±") { calcDisplay=String(-parseFloat(calcDisplay)||0); }
  else if (btn === "%") { calcDisplay=String(parseFloat(calcDisplay)/100); }
  else if (["÷","×","−","+"].includes(btn)) {
    calcExpr = calcDisplay + " " + btn; calcNewNum=true;
  }
  else if (btn === "=") {
    try {
      const full = calcExpr + " " + calcDisplay;
      const safe = full.replace(/÷/g,"/").replace(/×/g,"*").replace(/−/g,"-");
      const res = Function('"use strict";return ('+safe+')')();
      calcExpr = full + " =";
      calcDisplay = String(Math.round(res*1e10)/1e10);
    } catch(e) { calcDisplay="Ошибка"; }
    calcNewNum = true;
  }
  else if (btn === ".") {
    if (calcNewNum) { calcDisplay="0."; calcNewNum=false; }
    else if (!calcDisplay.includes(".")) calcDisplay+=".";
  }
  else {
    if (calcNewNum||calcDisplay==="0") { calcDisplay=btn; calcNewNum=false; }
    else calcDisplay+=btn;
  }
  disp.textContent = calcDisplay;
  if (expr) expr.textContent = calcExpr;
}

const amHistory = [];
function startActivityMonitor(wid) {
  amTab(wid,"CPU");
  const win = openWindows[wid];
  if (win) {
    win._amInterval = setInterval(() => {
      const cpu = Math.round(Math.random()*30+5);
      const ram = (Math.random()*4+6).toFixed(1);
      // Update CPU
      const cpuEl = document.getElementById(`am-cpu-${wid}`);
      if (cpuEl) cpuEl.textContent = `CPU: ${cpu}%`;
      const procs = [8,4,2,1,0.5];
      procs.forEach((base,i) => {
        const el = document.getElementById(`am-p-${wid}-${i}`);
        if (el) el.textContent = (base + Math.random()*3).toFixed(1)+"%";
      });
      // RAM
      const ramEl = document.getElementById(`am-ram-${wid}`);
      const ramBar = document.getElementById(`am-ram-bar-${wid}`);
      if (ramEl) ramEl.textContent = `RAM: ${ram} GB / 18 GB`;
      if (ramBar) ramBar.style.width = (ram/18*100)+"%";
      const memVals = [Math.round(ram*600)+" МБ", Math.round(Math.random()*200+50)+" МБ", Math.round(Math.random()*1000+2000)+" МБ", Math.round(Math.random()*500+1000)+" МБ"];
      ["Приложения","Сжатая","Кэш файловой системы","Проводная"].forEach((k,i)=>{ const el=document.getElementById(`am-mem-${wid}-${k}`); if(el) el.textContent=memVals[i]; });
      // Net
      const ni=document.getElementById(`am-net-in-${wid}`); const no=document.getElementById(`am-net-out-${wid}`);
      if(ni) ni.textContent = Math.round(Math.random()*500+50)+" КБ/с";
      if(no) no.textContent = Math.round(Math.random()*200+20)+" КБ/с";
      // Disk
      const dr=document.getElementById(`am-disk-r-${wid}`); const dw=document.getElementById(`am-disk-w-${wid}`);
      if(dr) dr.textContent = (Math.random()*5).toFixed(1)+" МБ/с";
      if(dw) dw.textContent = (Math.random()*2).toFixed(1)+" МБ/с";
      // Chart
      amHistory.push(cpu);
      if (amHistory.length > 60) amHistory.shift();
      const canvas = document.getElementById(`am-chart-${wid}`);
      if (canvas) {
        const ctx = canvas.getContext("2d");
        canvas.width = canvas.offsetWidth || 600;
        ctx.clearRect(0,0,canvas.width,canvas.height);
        ctx.beginPath(); ctx.strokeStyle="#30d158"; ctx.lineWidth=2;
        amHistory.forEach((v,i) => {
          const x = i/59*canvas.width;
          const y = canvas.height - v/100*canvas.height;
          i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
        });
        ctx.stroke();
        // Fill
        ctx.lineTo(canvas.width,canvas.height); ctx.lineTo(0,canvas.height);
        ctx.fillStyle="rgba(48,209,88,0.1)"; ctx.fill();
      }
    }, 1000);
  }
}

function renderDiskChart(wid) {
  const canvas = document.getElementById(`disk-chart-${wid}`);
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  const cx=150,cy=150,r=100;
  // Used: 218.5/500 = 43.7%
  const usedAngle = 0.437 * 2 * Math.PI;
  ctx.clearRect(0,0,300,300);
  ctx.beginPath(); ctx.arc(cx,cy,r,-Math.PI/2,-Math.PI/2+usedAngle); ctx.arc(cx,cy,60,-Math.PI/2+usedAngle,-Math.PI/2,true);
  ctx.closePath(); ctx.fillStyle="#0a84ff"; ctx.fill();
  ctx.beginPath(); ctx.arc(cx,cy,r,-Math.PI/2+usedAngle,-Math.PI/2+2*Math.PI); ctx.arc(cx,cy,60,-Math.PI/2+2*Math.PI,-Math.PI/2+usedAngle,true);
  ctx.closePath(); ctx.fillStyle="#30d158"; ctx.fill();
  ctx.fillStyle="#fff"; ctx.font="bold 18px -apple-system"; ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillText("500 ГБ",cx,cy-8); ctx.font="12px -apple-system"; ctx.fillStyle="#aaa"; ctx.fillText("SSD",cx,cy+12);
}

function formatTime(ms) {

}
function swToggle(wid) {

function timerToggle(wid) {

function stockSelect(wid, sym) {

  d.innerHTML=`<div style="margin-bottom:16px;"><div style="font-size:22px;font-weight:700;">${sym}</div><div style="font-size:14px;color:#888;">${s.name}</div><div style="font-size:44px;font-weight:200;margin:8px 0;">${s.price.toFixed(2)}<span style="font-size:14px;">USD</span></div><div style="font-size:16px;color:${s.change>=0?"#30d158":"#ff453a"};">${s.change>=0?"+":""}${s.change.toFixed(2)} (${s.pct.toFixed(2)}%) сегодня</div></div>
  <canvas id="stock-chart-${wid}" width="500" height="150" style="width:100%;border-radius:10px;background:rgba(255,255,255,0.04);display:block;"></canvas>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px;">
    ${[["Открытие",(s.price-s.change).toFixed(2)],["Максимум",(s.price+Math.abs(s.change)*1.5).toFixed(2)],["Минимум",(s.price-Math.abs(s.change)*2).toFixed(2)],["Объём","48.2M"],["Ср.Объём","52.7M"],["Р.капит.","2.94T"]].map(([k,v])=>`<div style="background:rgba(255,255,255,0.06);border-radius:8px;padding:10px;"><div style="font-size:11px;color:#888;">${k}</div><div style="font-weight:600;margin-top:2px;">${v}</div></div>`).join("")}
  </div>`;

function renderStockChart(wid,sym) {
  const canvas=document.getElementById(`stock-chart-${wid}`);
  if(!canvas) return;
  const s=stocksData[sym];
  const ctx=canvas.getContext("2d");
  canvas.width=canvas.offsetWidth||500;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const data=s.hist;
  const min=Math.min(...data)-2, max=Math.max(...data)+2;
  const color=s.change>=0?"#30d158":"#ff453a";
  ctx.beginPath(); ctx.strokeStyle=color; ctx.lineWidth=2;
  data.forEach((v,i)=>{const x=i/(data.length-1)*canvas.width;const y=(1-(v-min)/(max-min))*canvas.height;i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});
  ctx.stroke();
  // Gradient fill
  const grad=ctx.createLinearGradient(0,0,0,canvas.height);
  grad.addColorStop(0,color.replace(")",",0.3)").replace("rgb","rgba")||"rgba(48,209,88,0.3)"); grad.addColorStop(1,"transparent");
  ctx.lineTo(canvas.width,canvas.height); ctx.lineTo(0,canvas.height); ctx.fillStyle=s.change>=0?"rgba(48,209,88,0.15)":"rgba(255,69,58,0.15)"; ctx.fill();
}

    // Sweep

    ctx.fillStyle="rgba(48,209,88,0.25)"; ctx.fill();

    }).catch(()=>{ showNotification("Диктофон","Доступ к микрофону запрещён","🎤"); vmSimulate(wid); });
  } else {
    vmRecording=false; clearInterval(vmTimerInterval);
    if(vmRecorder&&vmRecorder.state!=="inactive") vmRecorder.stop();
    if(vmStream) { vmStream.getTracks().forEach(t=>t.stop()); vmStream=null; }
    const btn=document.getElementById(`vm-btn-${wid}`); if(btn){btn.style.background="#30d158";btn.textContent="▶";}

function vmSimulate(wid) {
  vmRecording=true; const btn=document.getElementById(`vm-btn-${wid}`); if(btn){btn.style.background="#ff453a";btn.textContent="⏹";}
  const status=document.getElementById(`vm-status-${wid}`); if(status) status.textContent="Запись... (симуляция)";

function renderShortcuts(wid) {
  return `<div style="height:100%;display:flex;background:#f5f5f7;font-size:13px;">

      <div style="padding:8px 14px;font-size:11px;font-weight:700;color:#999;margin-top:8px;">ГАЛЕРЕЯ</div>

function scRenderList(wid) {
  const list=document.getElementById(`sc-list-${wid}`); if(!list) return;
  list.innerHTML=shortcutsData.map((s,i)=>`<div style="padding:8px 14px;cursor:pointer;display:flex;align-items:center;gap:8px;" onclick="scOpen(${wid},${i})" onmouseenter="this.style.background='rgba(0,0,0,0.04)'" onmouseleave="this.style.background=''">
    <span style="font-size:20px;">${s.icon||"⚡"}</span><span>${s.name}</span>
    <button onclick="event.stopPropagation();scRun(${wid},${i})" style="margin-left:auto;background:#ff6600;color:#fff;border:none;border-radius:6px;padding:3px 8px;cursor:pointer;font-size:11px;">▶ Run</button>
  </div>`).join("") || `<div style="padding:14px;text-align:center;color:#888;font-size:12px;">Нет команд</div>`;
}
function scCreate(wid) {
  const name=prompt("Название команды:");if(!name)return;
  const actions=prompt("Действия (через запятую):\nПример: Открыть Safari, Включить тёмную тему");
  shortcutsData.push({name,icon:"⚡",actions:(actions||"").split(",").map(a=>a.trim()).filter(Boolean),date:new Date().toLocaleDateString("ru")});
  localStorage.setItem("mac_shortcuts",JSON.stringify(shortcutsData));
  scRenderList(wid);
  showNotification("Быстрые команды","Команда создана: "+name,"⚡");
}
function scOpen(wid,idx) {
  const s=shortcutsData[idx]; const d=document.getElementById(`sc-detail-${wid}`); if(!d||!s) return;
  d.innerHTML=`<div style="max-width:500px;">
    <div style="font-size:22px;font-weight:700;margin-bottom:4px;">${s.icon} ${s.name}</div>
    <div style="font-size:12px;color:#888;margin-bottom:20px;">Создана: ${s.date}</div>
    <div style="font-size:15px;font-weight:600;margin-bottom:12px;">Действия:</div>
    <div id="sc-actions-${wid}" style="display:flex;flex-direction:column;gap:8px;margin-bottom:20px;">
      ${s.actions.map((a,i)=>`<div class="shortcut-block"><span style="background:#ff6600;color:#fff;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:700;">${i+1}</span>${a}</div>`).join("") || `<div style="color:#888;">Нет действий</div>`}
    </div>
    <button onclick="scAddAction(${wid},${idx})" style="background:rgba(0,0,0,0.08);border:none;border-radius:8px;padding:8px 16px;cursor:pointer;margin-right:8px;">+ Добавить действие</button>
    <button onclick="scRun(${wid},${idx})" style="background:#ff6600;color:#fff;border:none;border-radius:8px;padding:8px 20px;cursor:pointer;font-weight:600;">▶ Выполнить</button>
    <button onclick="shortcutsData.splice(${idx},1);localStorage.setItem('mac_shortcuts',JSON.stringify(shortcutsData));scRenderList(${wid});d.innerHTML='<div style=\\'padding:40px;text-align:center;color:#888;\\'>Команда удалена</div>'" style="background:rgba(255,69,58,0.1);color:#ff453a;border:none;border-radius:8px;padding:8px 14px;cursor:pointer;margin-left:8px;">Удалить</button>
  </div>`;

function scAddAction(wid,idx) {
  const a=prompt("Действие:");if(!a)return;
  shortcutsData[idx].actions.push(a);
  localStorage.setItem("mac_shortcuts",JSON.stringify(shortcutsData));
  scOpen(wid,idx);
}
function scRun(wid,idx) {
  const s=shortcutsData[idx]; if(!s) return;
  showNotification("Быстрые команды","Выполняю: "+s.name,"⚡");
  s.actions.forEach((a,i)=>setTimeout(()=>{
    if(a.toLowerCase().includes("safari"))openApp("safari");
    else if(a.toLowerCase().includes("тёмн")||a.toLowerCase().includes("dark")){isDark=true;document.querySelectorAll(".window").forEach(w=>w.classList.add("dark"));}
    else if(a.toLowerCase().includes("светл")||a.toLowerCase().includes("light")){isDark=false;document.querySelectorAll(".window").forEach(w=>w.classList.remove("dark"));}
    else if(a.toLowerCase().includes("почт"))openApp("mail");
    else if(a.toLowerCase().includes("заметк"))openApp("notes");
    showNotification("⚡ "+s.name,a,"⚡");
  },i*800));
}
setTimeout(()=>{ Object.keys(openWindows).forEach(wid=>{ if(openWindows[wid].appId==="shortcuts") scRenderList(wid); }); },100);

// ========== 32. FREEFORM ==========
function renderFreeform(wid) {
  return `<div style="height:100%;display:flex;flex-direction:column;background:#f0f0f0;">
    <div style="padding:8px 12px;background:#fff;border-bottom:1px solid rgba(0,0,0,0.1);display:flex;gap:6px;align-items:center;flex-wrap:wrap;">
      <div style="display:flex;gap:4px;border-right:1px solid #ddd;padding-right:8px;margin-right:4px;">
        ${[["✏️","pen","Ручка"],["🔲","rect","Прямоугольник"],["⭕","circle","Круг"],["➡️","arrow","Стрелка"],["🗒️","sticky","Стикер"],["📝","text","Текст"],["↩️","undo","Отмена"],["🗑️","clear","Очистить"]].map(([i,t,l])=>`<button onclick="ffTool('${t}',${wid})" title="${l}" id="ff-tool-${wid}-${t}" style="background:${freeformTool===t?"rgba(0,100,255,0.15)":"rgba(0,0,0,0.06)"};border:none;border-radius:6px;padding:5px 8px;cursor:pointer;font-size:16px;">${i}</button>`).join("")}
      </div>
      <div style="display:flex;gap:4px;align-items:center;">
        ${["#0a84ff","#ff453a","#30d158","#ff9f0a","#bf5af2","#000000","#ffffff","#636366"].map(c=>`<div onclick="freeformColor='${c}'" style="width:20px;height:20px;border-radius:50%;background:${c};cursor:pointer;border:2px solid rgba(0,0,0,0.2);" title="${c}"></div>`).join("")}
        <input type="color" value="${freeformColor}" onchange="freeformColor=this.value" style="width:28px;height:28px;border:none;border-radius:6px;cursor:pointer;"/>
      </div>
      <input type="range" min="1" max="20" value="${freeformSize}" oninput="freeformSize=parseInt(this.value)" style="width:80px;accent-color:#0a84ff;" title="Размер кисти"/>
    </div>
    <canvas id="freeform-canvas-${wid}" style="flex:1;cursor:crosshair;display:block;background:#fff;background-image:radial-gradient(circle,#ddd 1px,transparent 1px);background-size:20px 20px;"></canvas>
  </div>`;
}
function initFreeform(wid) {
  const canvas=document.getElementById(`freeform-canvas-${wid}`); if(!canvas) return;
  canvas.width=canvas.offsetWidth; canvas.height=canvas.offsetHeight;
  const ctx=canvas.getContext("2d");
  let history=[];
  const saveState=()=>history.push(canvas.toDataURL());
  let currentTool=freeformTool, isDrawing=false, startX=0, startY=0;
  canvas.addEventListener("mousedown",e=>{
    const r=canvas.getBoundingClientRect();
    startX=e.clientX-r.left; startY=e.clientY-r.top;
    isDrawing=true; currentTool=freeformTool;
    if(currentTool==="pen"){ctx.beginPath();ctx.moveTo(startX,startY);}
    else if(currentTool==="sticky"){
      ctx.fillStyle="#ffeb3b"; ctx.fillRect(startX,startY,140,100);
      ctx.strokeStyle="rgba(0,0,0,0.2)"; ctx.strokeRect(startX,startY,140,100);
      ctx.fillStyle="#333"; ctx.font="13px -apple-system"; ctx.fillText("Стикер",startX+10,startY+20);
      const note=prompt("Текст стикера:","Заметка");
      if(note){ctx.fillStyle="#333";ctx.font="12px -apple-system";const words=note.split(" ");let line="",y=startY+36;words.forEach(w=>{const test=line+w+" ";if(ctx.measureText(test).width>120&&line!==""){ctx.fillText(line,startX+10,y);line=w+" ";y+=16;}else line=test;});ctx.fillText(line,startX+10,y);}
      isDrawing=false; saveState(); return;
    }
    else if(currentTool==="text"){
      const text=prompt("Текст:");
      if(text){ctx.fillStyle=freeformColor;ctx.font=`${freeformSize*3+10}px -apple-system`;ctx.fillText(text,startX,startY);}
      isDrawing=false; saveState(); return;
    }
  });
  canvas.addEventListener("mousemove",e=>{
    if(!isDrawing) return;
    const r=canvas.getBoundingClientRect();
    const x=e.clientX-r.left, y=e.clientY-r.top;
    if(currentTool==="pen"){ctx.lineTo(x,y);ctx.strokeStyle=freeformColor;ctx.lineWidth=freeformSize;ctx.lineCap="round";ctx.stroke();}
    else {
      if(history.length) { const img=new Image(); img.onload=()=>{ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0);}; img.src=history[history.length-1]; }
      else ctx.clearRect(0,0,canvas.width,canvas.height);
      ctx.strokeStyle=freeformColor; ctx.lineWidth=freeformSize; ctx.fillStyle=freeformColor+"33";
      if(currentTool==="rect"){ctx.beginPath();ctx.rect(startX,startY,x-startX,y-startY);ctx.stroke();ctx.fill();}
      else if(currentTool==="circle"){ctx.beginPath();ctx.ellipse((startX+x)/2,(startY+y)/2,Math.abs(x-startX)/2,Math.abs(y-startY)/2,0,0,2*Math.PI);ctx.stroke();ctx.fill();}
      else if(currentTool==="arrow"){ctx.beginPath();ctx.moveTo(startX,startY);ctx.lineTo(x,y);ctx.stroke();const a=Math.atan2(y-startY,x-startX);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-15*Math.cos(a-0.5),y-15*Math.sin(a-0.5));ctx.moveTo(x,y);ctx.lineTo(x-15*Math.cos(a+0.5),y-15*Math.sin(a+0.5));ctx.stroke();}
    }
  });
  canvas.addEventListener("mouseup",()=>{ isDrawing=false; saveState(); });
  canvas.addEventListener("mouseleave",()=>{ isDrawing=false; });
  // Store ctx and history on canvas element
  canvas._ctx=ctx; canvas._history=history;
}
function ffTool(tool,wid) {
  if(tool==="undo") { const canvas=document.getElementById(`freeform-canvas-${wid}`); if(!canvas||!canvas._history) return; if(canvas._history.length>1){canvas._history.pop();const img=new Image();img.onload=()=>canvas._ctx.clearRect(0,0,canvas.width,canvas.height)||canvas._ctx.drawImage(img,0,0);img.src=canvas._history[canvas._history.length-1];} else { canvas._ctx.clearRect(0,0,canvas.width,canvas.height); canvas._history=[]; } return; }
  if(tool==="clear") { const canvas=document.getElementById(`freeform-canvas-${wid}`); if(!canvas) return; canvas._ctx?.clearRect(0,0,canvas.width,canvas.height); canvas._history=[]; return; }
  freeformTool=tool;
  document.querySelectorAll(`[id^="ff-tool-${wid}-"]`).forEach(el=>el.style.background="rgba(0,0,0,0.06)");
  const btn=document.getElementById(`ff-tool-${wid}-${tool}`); if(btn) btn.style.background="rgba(0,100,255,0.15)";
}

      </div>
    </div>
  </div>`;
